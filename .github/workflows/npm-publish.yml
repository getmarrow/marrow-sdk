# npm trusted publishing (GitHub OIDC, npm provenance) for @getmarrow/sdk.
#
# Only an annotated tag npm-sdk-vX.Y.Z on a commit already on master starts
# this workflow. The ops-server release script creates that tag after all of its
# release gates pass. The tag message carries the tarball integrity that the ops
# server computed from the audited commit, and the publish job publishes only a
# tarball with exactly that integrity. Repository rulesets restrict who may
# create, move or delete npm-* tags. The npm-publish environment accepts only
# npm-sdk-v* tags.
#
# The build job runs project and dependency code, so it never holds an OIDC
# token. The publish job runs no project code, has no checkout, and holds no npm
# token: npm authenticates with the job's OIDC token.
name: npm publish

on:
  push:
    tags:
      - 'npm-sdk-v*'

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: '@getmarrow/sdk'
  TAG_LABEL: sdk
  NODE_PIN: v22.23.3
  # npm bundled with Node 22.23.3. npm pack output was measured byte-identical to
  # the ops server's (Node 22.23.x, npm 10.9.8) for all three packages.
  PACK_NPM_VERSION: 10.9.9
  PUBLISH_NPM_VERSION: 11.19.1
  PUBLISH_NPM_INTEGRITY: sha512-ztsxKxt/kkIaAs+2i0GU6I+DRmUdrNasxTZKJe9TCdSjKxlhah/4r/hl5ygMD6XAg1qZ9c2TNomR4qgOydp10g==

jobs:
  build:
    name: Build, test and pack (no OIDC)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # read the tag object, compare with master, check out the tagged commit
    steps:
      - name: Verify the release tag and its release record
        id: tag
        env:
          LC_ALL: C
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$EVENT" = push ] || { echo '::error::Only tag pushes may publish.'; exit 1; }
          [ "${#TAG}" -le 64 ] || { echo '::error::Release tag is too long.'; exit 1; }
          [[ "$TAG" =~ ^npm-${TAG_LABEL}-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo '::error::Release tag does not match npm-<label>-vMAJOR.MINOR.PATCH for this package.'; exit 1; }
          [ "$REF" = "refs/tags/$TAG" ] || { echo '::error::Event ref is not this tag.'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid commit SHA.'; exit 1; }
          version="${TAG#npm-"$TAG_LABEL"-v}"
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          [ "$(jq -r '.ref' <<<"$ref_json")" = "refs/tags/$TAG" ] || { echo '::error::Tag ref lookup mismatch.'; exit 1; }
          [ "$(jq -r '.object.type' <<<"$ref_json")" = tag ] || { echo '::error::Release tag must be an annotated tag.'; exit 1; }
          tag_object="$(jq -r '.object.sha' <<<"$ref_json")"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid tag object.'; exit 1; }
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          [ "$(jq -r '.tag' <<<"$tag_json")" = "$TAG" ] || { echo '::error::Tag object name mismatch.'; exit 1; }
          [ "$(jq -r '.object.type' <<<"$tag_json")" = commit ] || { echo '::error::Tag must point to a commit.'; exit 1; }
          [ "$(jq -r '.object.sha' <<<"$tag_json")" = "$GITHUB_SHA" ] || { echo '::error::Tag no longer points to the triggering commit.'; exit 1; }
          mapfile -t lines < <(jq -r '.message' <<<"$tag_json" | sed -e '/^$/d')
          [ "${#lines[@]}" -eq 5 ] || { echo '::error::Tag message is not a five-line npm release record.'; exit 1; }
          [ "${lines[0]}" = 'npm-release v1' ] || { echo '::error::Unknown release record format.'; exit 1; }
          [ "${lines[1]}" = "package: $EXPECTED_PACKAGE" ] || { echo '::error::Release record names another package.'; exit 1; }
          [ "${lines[2]}" = "version: $version" ] || { echo '::error::Release record version differs from the tag.'; exit 1; }
          [ "${lines[3]}" = "commit: $GITHUB_SHA" ] || { echo '::error::Release record commit differs from the tag commit.'; exit 1; }
          [[ "${lines[4]}" =~ ^integrity:\ (sha512-[A-Za-z0-9+/]{86}==)$ ]] || { echo '::error::Release record integrity is malformed.'; exit 1; }
          integrity="${BASH_REMATCH[1]}"
          compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...master")"
          [ "$(jq -r '.behind_by' <<<"$compare_json")" = 0 ] || { echo '::error::Tagged commit is not on master.'; exit 1; }
          case "$(jq -r '.status' <<<"$compare_json")" in ahead|identical) ;; *) echo '::error::Tagged commit is not on master.'; exit 1 ;; esac
          printf 'version=%s\nintegrity=%s\n' "$version" "$integrity" >>"$GITHUB_OUTPUT"
          echo "Release record: $EXPECTED_PACKAGE@$version commit $GITHUB_SHA integrity $integrity"

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Check the pinned toolchain
        run: |
          set -euo pipefail
          [ "$(node --version)" = "$NODE_PIN" ] || { echo '::error::Unexpected Node version.'; exit 1; }
          [ "$(npm --version)" = "$PACK_NPM_VERSION" ] || { echo '::error::Unexpected npm version.'; exit 1; }

      - name: Check the commit, package metadata and npm occupancy
        env:
          LC_ALL: C
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo '::error::Checkout is not the tagged commit.'; exit 1; }
          # Tarball bytes include file modes; the ops server computes the integrity from a 644/755 tree.
          unreadable="$(find . -path ./.git -prune -o -type f ! -perm -044 -print | wc -l)"
          [ "$unreadable" = 0 ] || { echo '::error::Checkout has files without group/other read permission.'; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master \
            || { echo '::error::Tagged commit is not an ancestor of origin/master.'; exit 1; }
          [ "$(jq -r '.name' package.json)" = "$EXPECTED_PACKAGE" ] || { echo '::error::package.json name mismatch.'; exit 1; }
          [ "$(jq -r '.version' package.json)" = "$VERSION" ] || { echo '::error::package.json version differs from the tag.'; exit 1; }
          status=0
          out="$(npm view "$EXPECTED_PACKAGE@$VERSION" version --json 2>/dev/null)" || status=$?
          if [ "$status" -eq 0 ]; then
            [ -z "$out" ] || { echo '::error::This version is already on npm.'; exit 1; }
          else
            [ "$(jq -r '.error.code // empty' <<<"$out" 2>/dev/null || true)" = E404 ] \
              || { echo '::error::npm registry lookup failed; refusing to continue.'; exit 1; }
          fi

      - name: Install dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Validate the production dependency tree
        run: npm ls --omit=dev
      - name: Pack and compare with the release record
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.tag.outputs.integrity }}
        run: |
          set -euo pipefail
          [ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || { echo '::error::Build or tests changed the checkout.'; exit 1; }
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          npm pack --json --pack-destination "$out" >"$RUNNER_TEMP/pack.json"
          jq -e --arg n "$EXPECTED_PACKAGE" --arg v "$VERSION" \
            'type == "array" and length == 1 and .[0].name == $n and .[0].version == $v' "$RUNNER_TEMP/pack.json" >/dev/null \
            || { echo '::error::npm pack output is invalid.'; exit 1; }
          file="$out/$(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")"
          [ "$(find "$out" -type f | wc -l)" -eq 1 ] && [ -f "$file" ] || { echo '::error::Expected exactly one tarball.'; exit 1; }
          actual="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
          echo "Packed $file integrity $actual"
          [ "$actual" = "$(jq -r '.[0].integrity' "$RUNNER_TEMP/pack.json")" ] || { echo '::error::npm pack integrity report mismatch.'; exit 1; }
          [ "$actual" = "$EXPECTED_INTEGRITY" ] || { echo '::error::Packed tarball differs from the audited release record.'; exit 1; }

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish with provenance (OIDC)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read # read the tag object and compare it with master; no checkout
      id-token: write # npm trusted publishing and provenance; this job runs no project code
    steps:
      - name: Verify the release tag and its release record
        id: tag
        env:
          LC_ALL: C
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$EVENT" = push ] || { echo '::error::Only tag pushes may publish.'; exit 1; }
          [ "${#TAG}" -le 64 ] || { echo '::error::Release tag is too long.'; exit 1; }
          [[ "$TAG" =~ ^npm-${TAG_LABEL}-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo '::error::Release tag does not match npm-<label>-vMAJOR.MINOR.PATCH for this package.'; exit 1; }
          [ "$REF" = "refs/tags/$TAG" ] || { echo '::error::Event ref is not this tag.'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid commit SHA.'; exit 1; }
          version="${TAG#npm-"$TAG_LABEL"-v}"
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          [ "$(jq -r '.ref' <<<"$ref_json")" = "refs/tags/$TAG" ] || { echo '::error::Tag ref lookup mismatch.'; exit 1; }
          [ "$(jq -r '.object.type' <<<"$ref_json")" = tag ] || { echo '::error::Release tag must be an annotated tag.'; exit 1; }
          tag_object="$(jq -r '.object.sha' <<<"$ref_json")"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid tag object.'; exit 1; }
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          [ "$(jq -r '.tag' <<<"$tag_json")" = "$TAG" ] || { echo '::error::Tag object name mismatch.'; exit 1; }
          [ "$(jq -r '.object.type' <<<"$tag_json")" = commit ] || { echo '::error::Tag must point to a commit.'; exit 1; }
          [ "$(jq -r '.object.sha' <<<"$tag_json")" = "$GITHUB_SHA" ] || { echo '::error::Tag no longer points to the triggering commit.'; exit 1; }
          mapfile -t lines < <(jq -r '.message' <<<"$tag_json" | sed -e '/^$/d')
          [ "${#lines[@]}" -eq 5 ] || { echo '::error::Tag message is not a five-line npm release record.'; exit 1; }
          [ "${lines[0]}" = 'npm-release v1' ] || { echo '::error::Unknown release record format.'; exit 1; }
          [ "${lines[1]}" = "package: $EXPECTED_PACKAGE" ] || { echo '::error::Release record names another package.'; exit 1; }
          [ "${lines[2]}" = "version: $version" ] || { echo '::error::Release record version differs from the tag.'; exit 1; }
          [ "${lines[3]}" = "commit: $GITHUB_SHA" ] || { echo '::error::Release record commit differs from the tag commit.'; exit 1; }
          [[ "${lines[4]}" =~ ^integrity:\ (sha512-[A-Za-z0-9+/]{86}==)$ ]] || { echo '::error::Release record integrity is malformed.'; exit 1; }
          integrity="${BASH_REMATCH[1]}"
          compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...master")"
          [ "$(jq -r '.behind_by' <<<"$compare_json")" = 0 ] || { echo '::error::Tagged commit is not on master.'; exit 1; }
          case "$(jq -r '.status' <<<"$compare_json")" in ahead|identical) ;; *) echo '::error::Tagged commit is not on master.'; exit 1 ;; esac
          printf 'version=%s\nintegrity=%s\n' "$version" "$integrity" >>"$GITHUB_OUTPUT"
          echo "Release record: $EXPECTED_PACKAGE@$version commit $GITHUB_SHA integrity $integrity"

      - name: Set up the pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Install the pinned npm used for publishing
        working-directory: ${{ runner.temp }}
        # The npm CLI tarball is pinned by exact version and sha512 below, so this install is lockfile-equivalent.
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          [ "$(node --version)" = "$NODE_PIN" ] || { echo '::error::Unexpected Node version.'; exit 1; }
          dir="$RUNNER_TEMP/npm-cli"
          mkdir -p "$dir"
          (cd "$dir" && npm pack "npm@$PUBLISH_NPM_VERSION" >/dev/null)
          file="$dir/npm-$PUBLISH_NPM_VERSION.tgz"
          [ "sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)" = "$PUBLISH_NPM_INTEGRITY" ] \
            || { echo '::error::npm CLI tarball integrity mismatch.'; exit 1; }
          npm install --global --ignore-scripts --no-audit --no-fund "$file"
          [ "$(npm --version)" = "$PUBLISH_NPM_VERSION" ] || { echo '::error::Unexpected npm version.'; exit 1; }

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/artifact

      - name: Verify the tarball against the release record
        working-directory: ${{ runner.temp }}
        env:
          LC_ALL: C
          VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.tag.outputs.integrity }}
        run: |
          set -euo pipefail
          name="${EXPECTED_PACKAGE#@}"
          file="$RUNNER_TEMP/artifact/${name/\//-}-$VERSION.tgz"
          [ "$(find "$RUNNER_TEMP/artifact" -mindepth 1 | wc -l)" -eq 1 ] && [ -f "$file" ] && [ ! -L "$file" ] \
            || { echo '::error::Artifact must contain exactly the expected tarball.'; exit 1; }
          actual="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
          [ "$actual" = "$EXPECTED_INTEGRITY" ] || { echo '::error::Tarball differs from the audited release record.'; exit 1; }
          manifest="$(tar -xzOf "$file" package/package.json)"
          [ "$(jq -r '.name' <<<"$manifest")" = "$EXPECTED_PACKAGE" ] || { echo '::error::Tarball package name mismatch.'; exit 1; }
          [ "$(jq -r '.version' <<<"$manifest")" = "$VERSION" ] || { echo '::error::Tarball version mismatch.'; exit 1; }
          echo "Verified $file integrity $actual"

      - name: Confirm no npm token exists and the version is still free
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          [ -z "${NODE_AUTH_TOKEN+set}" ] && [ -z "${NPM_TOKEN+set}" ] || { echo '::error::An npm token variable is set.'; exit 1; }
          auth_vars="$(env -0 | cut -z -d= -f1 | grep -zciE '^(node_auth_token|npm_token)$|^npm_config_(_auth|//)|_authtoken' || true)"
          [ "$auth_vars" = 0 ] || { echo '::error::An npm auth setting is in the environment.'; exit 1; }
          for config in "$(npm config get userconfig)" "$(npm config get globalconfig)" "$RUNNER_TEMP/.npmrc"; do
            if [ -e "$config" ] && grep -iqE '_auth|token' "$config"; then echo '::error::An npm config file holds an auth setting.'; exit 1; fi
          done
          status=0
          out="$(npm view "$EXPECTED_PACKAGE@$VERSION" version --json 2>/dev/null)" || status=$?
          if [ "$status" -eq 0 ]; then
            [ -z "$out" ] || { echo '::error::This version is already on npm.'; exit 1; }
          else
            [ "$(jq -r '.error.code // empty' <<<"$out" 2>/dev/null || true)" = E404 ] \
              || { echo '::error::npm registry lookup failed; refusing to continue.'; exit 1; }
          fi

      - name: Publish with provenance
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.tag.outputs.integrity }}
        run: |
          set -euo pipefail
          name="${EXPECTED_PACKAGE#@}"
          source_file="$RUNNER_TEMP/artifact/${name/\//-}-$VERSION.tgz"
          # npm records the tarball path in the public _resolved metadata, so publish
          # a byte-identical copy from a neutral directory (ops-server rule N-1).
          dir="$(mktemp -d /tmp/npm-publish.XXXXXX)"
          file="$dir/${source_file##*/}"
          cp -- "$source_file" "$file"
          mkdir "$dir/node_modules"
          cmp -s -- "$source_file" "$file" || { echo '::error::Neutral publish copy differs.'; exit 1; }
          [ "sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)" = "$EXPECTED_INTEGRITY" ] \
            || { echo '::error::Neutral publish copy differs from the release record.'; exit 1; }
          cd "$dir"
          npm publish "./${file##*/}" --provenance --access public --tag latest --ignore-scripts

      - name: Verify the published version and its provenance
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.tag.outputs.integrity }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          got=''
          for _ in $(seq 1 20); do
            got="$(npm view "$EXPECTED_PACKAGE@$VERSION" dist.integrity 2>/dev/null || true)"
            [ "$got" = "$EXPECTED_INTEGRITY" ] && break
            sleep 15
          done
          [ "$got" = "$EXPECTED_INTEGRITY" ] || { echo '::error::Published integrity does not match.'; exit 1; }
          [ "$(npm view "$EXPECTED_PACKAGE@$VERSION" dist.attestations.provenance.predicateType)" = 'https://slsa.dev/provenance/v1' ] \
            || { echo '::error::Provenance attestation is missing.'; exit 1; }
          encoded="%40${EXPECTED_PACKAGE#@}"
          payload="$(curl -fsS --retry 5 --retry-all-errors "https://registry.npmjs.org/-/npm/v1/attestations/${encoded/\//%2f}@$VERSION" \
            | jq -r '[.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1")] | if length == 1 then .[0].bundle.dsseEnvelope.payload else empty end' \
            | base64 -d)"
          digest="$(printf '%s' "${EXPECTED_INTEGRITY#sha512-}" | base64 -d | od -An -v -tx1 | tr -d ' \n')"
          jq -e --arg d "$digest" --arg c "$GITHUB_SHA" --arg r "refs/tags/$TAG" --arg repo "https://github.com/$GITHUB_REPOSITORY" \
            '.subject[0].digest.sha512 == $d
             and .predicate.buildDefinition.externalParameters.workflow.ref == $r
             and .predicate.buildDefinition.externalParameters.workflow.repository == $repo
             and .predicate.buildDefinition.externalParameters.workflow.path == ".github/workflows/npm-publish.yml"
             and .predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit == $c' <<<"$payload" >/dev/null \
            || { echo '::error::Provenance does not match this tarball, commit and tag.'; exit 1; }
          echo "Published $EXPECTED_PACKAGE@$VERSION with provenance for $GITHUB_SHA"
